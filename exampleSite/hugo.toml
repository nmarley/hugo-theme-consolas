baseURL = "https://example.com/"
languageCode = "en-us"
title = "ngmarley.com"
theme = "hugo-theme-consolas"

[pagination]
  pagerSize = 3

[taxonomies]
  tag = "tags"

[params]
  description = "Travel, Language, Life. Tea."
  dateFormat = "2006-01-02"

[params.social]
  github = "nmarley"
  twitter = "ngmarley"
  linkedin = "nmarley"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menus]
  [[menus.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menus.main]]
    name = "Projects"
    url = "/projects/"
    weight = 3
