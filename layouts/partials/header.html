<header class="site-header">
  <div class="container header-inner">
    <a href="{{ .Site.BaseURL }}" class="site-title">{{ .Site.Title }}</a>
    {{- with .Site.Menus.main }}
    <nav class="site-nav">
      {{- range $i, $e := . -}}
        {{- if $i }} <span class="sep">|</span> {{ end -}}
        {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) (eq $.RelPermalink .URL) (hasPrefix $.RelPermalink .URL) -}}
        <a href="{{ .URL }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    {{- end }}
  </div>
</header>
