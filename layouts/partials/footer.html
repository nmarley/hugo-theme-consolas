<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-links">
      {{- with .Site.Params.social }}
        {{- with .github }}
        <a href="https://github.com/{{ . }}" rel="me noopener" target="_blank">GitHub</a>
        {{- end }}
        {{- with .twitter }}
        <span class="sep">|</span>
        <a href="https://x.com/{{ . }}" rel="me noopener" target="_blank">X</a>
        {{- end }}
        {{- with .linkedin }}
        <span class="sep">|</span>
        <a href="https://linkedin.com/in/{{ . }}" rel="me noopener" target="_blank">LinkedIn</a>
        {{- end }}
      {{- end }}
    </div>
    <div class="footer-copy">
      &copy; {{ now.Year }} {{ .Site.Title }}
    </div>
  </div>
</footer>
